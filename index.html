<!doctype html>

<html
  lang="en"
  class="[scrollbar-width:thin] [scrollbar-color:rgba(113,128,143,0.35)_transparent] print:bg-white [&_*]:[scrollbar-width:thin] [&_*]:[scrollbar-color:rgba(113,128,143,0.35)_transparent] [&_*::-webkit-scrollbar]:size-2 [&_*::-webkit-scrollbar-thumb]:rounded-lg [&_*::-webkit-scrollbar-thumb]:bg-[rgba(113,128,143,0.3)] [&_*::-webkit-scrollbar-track]:bg-transparent [&::-webkit-scrollbar]:size-2 [&::-webkit-scrollbar-thumb]:rounded-lg [&::-webkit-scrollbar-thumb]:bg-[rgba(113,128,143,0.3)] [&::-webkit-scrollbar-track]:bg-transparent"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f5f5f5"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#121212"
    />
    <meta
      name="description"
      content="hangtiancheng — resume (QQ Mail style, IndexedDB-backed)"
    />
    <script>
      (() => {
        const mq = matchMedia("(prefers-color-scheme: dark)");
        const apply = () =>
          document.documentElement.classList.toggle("dark", mq.matches);
        mq.addEventListener("change", apply);
        apply();
      })();
    </script>
    <link
      rel="icon"
      href="/favicon.svg"
      type="image/svg+xml"
      fetchpriority="low"
    />
    <link rel="icon" href="/favicon.ico" sizes="48x48" fetchpriority="low" />
    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon-180x180.png"
      fetchpriority="low"
    />
    <title>简历</title>
  </head>
  <body class="selection:bg-[rgba(15,122,245,0.18)] print:bg-white">
    <div id="app"></div>
    <script type="module" src="/src/main.tsx" fetchpriority="high"></script>
  </body>
</html>
